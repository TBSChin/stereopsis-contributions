name: Windows development preview
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyinstaller==6.22.3
      - shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Stereopsis-Windows-READ-ONLY-development-preview
          path: dist/Stereopsis-Contributor-Installer-Windows-dev.zip
          retention-days: 14
